name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Decode signing key
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_B64: ${{ secrets.FREEMOTE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "::error::Signing secrets are missing"; exit 1; fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "FREEMOTE_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          FREEMOTE_STORE_PASSWORD: ${{ secrets.FREEMOTE_STORE_PASSWORD }}
          FREEMOTE_KEY_ALIAS: ${{ secrets.FREEMOTE_KEY_ALIAS }}
          FREEMOTE_KEY_PASSWORD: ${{ secrets.FREEMOTE_KEY_PASSWORD }}
          FREEMOTE_VERSION_CODE: ${{ github.run_number }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then export FREEMOTE_VERSION_NAME="${GITHUB_REF_NAME#v}"; fi
          ./gradlew --no-daemon assembleRelease
          APK=app/build/outputs/apk/release/app-release.apk
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            test -f "$APK" || { echo "::error::Signed APK not produced"; exit 1; }
            BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1); "$BT/apksigner" verify --print-certs "$APK"
          fi
          mkdir -p out && cp app/build/outputs/apk/release/*.apk out/FreeMote.apk

      - uses: actions/upload-artifact@v4
        with:
          name: FreeMote-apk
          path: out/FreeMote.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/FreeMote.apk \
            --title "FreeMote $GITHUB_REF_NAME" \
            --notes "Download **FreeMote.apk** below on your Android phone and open it to install. See the README for step-by-step help."
